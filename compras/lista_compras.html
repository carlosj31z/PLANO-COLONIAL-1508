}

.bar{height:8px;background:var(--soft);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.models{display:grid;gap:6px}
.model{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start;border:1px solid var(--line);border-radius:9px;padding:8px 10px;cursor:pointer;background:var(--soft)}

.model b{font-weight:600;font-size:14px}
.model p{grid-column:2;margin:0;font-size:13px;color:var(--muted)}
.model a{font-size:12.5px;color:var(--accent)}
.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}

.fields .wide{grid-column:span 2}
.fields input.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tip{font-size:13px;color:var(--muted);background:var(--soft);border-radius:8px;padding:8px 10px;margin:0}
details.more summary{cursor:pointer;color:var(--accent);font-size:13.5px}
.rolls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:4px 0}
.win{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--soft);display:grid;gap:6px;justify-items:center;text-align:center}
.win svg{width:100%;max-width:120px;height:auto}
.win b{font-family:var(--f-mono);font-size:14px}

.save p{margin:0;font-size:14px}
.note{font-size:13px;color:var(--muted)}

.add{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:end}
.add label{display:grid;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.add input,.add select{width:100%;min-width:0;border:1px solid var(--line);border-radius:7px;background:var(--card);padding:6px 8px}

<script id="principal">
(function(){
'use strict';
const ROOMS = ['Sala – comedor','Dormitorio principal','Dormitorio 2','Cuarto de trabajo','Cocina','Lavandería','Depósito','Baño 1 (principal)','Baño 2 (secundario)','Baño 3 (servicio)','Balcón','Por definir'];
const STATES = [['pendiente','Pendiente'],['cotizado','Cotizado'],['comprado','Comprado'],['instalado','Instalado']];
const ORDER = ['Cortinas roller','Sala y comedor','Dormitorios','Baños','Cocina','Lavandería','Herramientas','Limpieza','Otros'];
const LS = 'compras-1508-local';
const $ = s => document.querySelector(s);
const app = $('#app');
let S = JSON.parse(document.getElementById('estado').textContent);
let filter = 'todos', dirty = false, canPublish = null, artifact = null, saving = false, autoT = 0;
try { const pend = sessionStorage.getItem(LS + '-pend'); if (pend){ sessionStorage.removeItem(LS + '-pend'); } } catch (e) {}

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function money(n){ return 'S/ ' + n.toLocaleString('es-PE', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }
function num(v){ const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; }
function q(text){ return 'https://www.google.com/search?q=' + encodeURIComponent(text + ' Perú'); }

function winSvg(w, h){
  const W = 100, k = W / 1.2, rw = w * k, rh = h * k;
  return `<svg viewBox="0 0 ${W + 4} ${1.3 * k + 4}" role="img" aria-label="Ventana de ${w.toFixed(2)} por ${h.toFixed(2)} metros"><rect x="2" y="2" width="${rw}" height="${rh}" fill="none" stroke="currentColor" stroke-opacity=".5" stroke-width="1.5"/><rect x="2" y="2" width="${rw}" height="${rh * 0.55}" fill="var(--accent)" fill-opacity=".28"/><rect x="2" y="2" width="${rw}" height="5" fill="var(--accent)"/></svg>`;
}

function render(){
  const items = S.items;
  const done = items.filter(i => i.estado === 'comprado' || i.estado === 'instalado').length;
  const spent = items.reduce((a, i) => a + ((i.estado === 'comprado' || i.estado === 'instalado') ? num(i.precio) * (i.cant || 1) : 0), 0);
  const quoted = items.reduce((a, i) => a + (i.estado === 'cotizado' ? num(i.precio) * (i.cant || 1) : 0), 0);
  const unsure = items.filter(i => !i.ubicOk).length;
  let h = `<header><h1>Compras del departamento 1508</h1><p>Marca cada artículo según avances: pendiente, cotizado, comprado o instalado. Los modelos son tentativos; elige uno y anota el precio y la tienda cuando lo tengas.</p></header>`;
  h += `<div class="sum"><div><b>${done}/${items.length}</b><span>Comprados</span></div><div><b>${money(spent)}</b><span>Gastado</span></div><div><b>${money(quoted)}</b><span>Cotizado por comprar</span></div></div>`;
  h += `<div class="bar" aria-hidden="true"><i style="width:${items.length ? done / items.length * 100 : 0}%"></i></div>`;
  h += `<div class="tools"><div class="chips" role="group" aria-label="Filtrar">${[['todos','Todos'],['pendiente','Pendientes'],['cotizado','Cotizados'],['comprado','Comprados'],['instalado','Instalados'],['ubic','Ubicación por confirmar (' + unsure + ')']].map(([k, l]) => `<button class="chip" data-f="${k}" aria-pressed="${filter === k}">${l}</button>`).join('')}</div></div>`;

  const groups = {};
  for (const it of items){ const g = ORDER.includes(it.cat) ? it.cat : 'Otros'; (groups[g] = groups[g] || []).push(it); }
  for (const g of ORDER){
    const L = (groups[g] || []).filter(i => filter === 'todos' || (filter === 'ubic' ? !i.ubicOk : i.estado === filter));
    if (!L.length) continue;
    const gDone = (groups[g] || []).filter(i => i.estado === 'comprado' || i.estado === 'instalado').length;
    h += `<h2>${esc(g)}<small>${gDone}/${groups[g].length}</small></h2>`;
    if (g === 'Cortinas roller' && filter === 'todos'){
      h += `<p class="tip">Cuatro ventanas con cortina roller, todas de 1.25 m de alto. La ventana de la lavandería queda sin cortina. Confirma con el proveedor si las medidas son del vano (cortina por dentro: suele fabricarse 1 cm menos de ancho) o si la cortina irá por fuera del vano (suma 5–10 cm por lado).</p>`;
      h += `<div class="rolls">${groups[g].map(i => `<div class="win">${winSvg(i.roller.w, i.roller.h)}<b>${i.roller.w.toFixed(2)} × ${i.roller.h.toFixed(2)}</b><span>${esc(i.ubic)} · ${(i.roller.w * i.roller.h).toFixed(2)} m²</span></div>`).join('')}</div>`;
    }
    h += `<div class="list">${L.map(card).join('')}</div>`;
  }
  if (!items.some(i => filter === 'todos' || (filter === 'ubic' ? !i.ubicOk : i.estado === filter))) h += `<p class="note" style="margin-top:20px">No hay artículos en este filtro.</p>`;

  h += `<h2>Agregar artículo</h2><form class="add" id="addForm"><label>Nombre<input id="aNom" required placeholder="Ej.: Tacho de basura de cocina"></label><label>Ambiente<select id="aUb">${ROOMS.map(r => `<option>${esc(r)}</option>`).join('')}</select></label><label>Medida<input id="aMed" placeholder="Opcional"></label><button class="btn primary" type="submit">Agregar</button></form>`;
  h += `<h2>Compartir</h2><p class="note">Copia la lista en texto para enviarla por WhatsApp o llevarla a la tienda.</p><div class="tools"><button class="btn" id="copy">Copiar lista pendiente</button></div><textarea id="out" hidden readonly></textarea>`;
  h += `<div class="save" id="saveBar" ${dirty ? '' : 'hidden'}><p id="saveMsg">${saveText()}</p><button class="btn primary" id="saveBtn" ${saving ? 'disabled' : ''}>Guardar ahora</button></div>`;
  app.innerHTML = h;
  bind();
}

function card(it){
  const sel = it.modelos && it.modelos[it.sel];
  let h = `<article class="item" data-st="${it.estado}" data-id="${it.id}">`;
  h += `<div class="top"><div><h3>${esc(it.nombre)}${it.cant > 1 ? ' ×' + it.cant : ''}</h3>${it.medida ? `<div class="med">${esc(it.medida)}</div>` : ''}<div class="where">Ubicación: <b>${esc(it.ubic)}</b>${it.ubicOk ? '' : '<span class="ask">por confirmar</span>'}</div></div>`;
  h += `<div class="states" role="group" aria-label="Estado de ${esc(it.nombre)}">${STATES.map(([v, l]) => `<button data-st="${v}" data-v="${v}" aria-pressed="${it.estado === v}">${l}</button>`).join('')}</div></div>`;
  if (it.modelos && it.modelos.length){
    h += `<details class="more" ${it.estado === 'pendiente' || it.estado === 'cotizado' ? 'open' : ''}><summary>Modelo elegido: ${esc(sel ? sel.n : '—')}</summary><div class="models" role="radiogroup" aria-label="Modelos tentativos" style="margin-top:8px">`;
    it.modelos.forEach((m, k) => {
      h += `<label class="model" aria-checked="${k === it.sel}"><input type="radio" name="m-${it.id}" value="${k}" ${k === it.sel ? 'checked' : ''} data-m="${k}"><b>${esc(m.n)}</b><p>${esc(m.d)} <a href="${q(m.n + ' ' + (it.medida || ''))}" target="_blank" rel="noopener">Buscar precios</a></p></label>`;
    });
    h += `</div></details>`;
  }
  if (it.tip) h += `<p class="tip">${esc(it.tip)}</p>`;
  h += `<div class="fields">`;
  h += `<label>Ubicación<select data-k="ubic">${ROOMS.map(r => `<option ${r === it.ubic ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select></label>`;
  h += `<label>Cantidad<input class="num" type="number" min="1" step="1" inputmode="numeric" data-k="cant" value="${it.cant || 1}"></label>`;
  h += `<label>Precio unitario (S/)<input class="num" type="text" inputmode="decimal" data-k="precio" value="${esc(it.precio)}" placeholder="0.00"></label>`;
  h += `<label>Tienda<input type="text" data-k="tienda" value="${esc(it.tienda)}" placeholder="Ej.: Sodimac"></label>`;
  h += `<label class="wide">Nota<input type="text" data-k="nota" value="${esc(it.nota)}" placeholder="Medida exacta, color, fecha de instalación…"></label>`;
  if (it.roller){
    h += `<label>Ancho (m)<input class="num" type="text" inputmode="decimal" data-r="w" value="${it.roller.w}"></label><label>Alto (m)<input class="num" type="text" inputmode="decimal" data-r="h" value="${it.roller.h}"></label>`;
  } else h += `<label>Medida<input type="text" data-k="medida" value="${esc(it.medida)}"></label><span></span>`;
  h += `</div>`;
  if (it.custom) h += `<div><button class="btn small danger" data-del="1">Quitar de la lista</button></div>`;
  return h + `</article>`;
}

function saveText(){
  if (saving) return 'Guardando…';
  if (canPublish === false) return 'Cambios guardados solo en este navegador (esta vista no puede editar la lista compartida).';
  return 'Tienes cambios sin guardar. Se guardan solos en unos segundos.';
}
function touch(rerender = true){
  dirty = true;
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}
  if (rerender) render(); else { const b = $('#saveBar'); if (b){ b.hidden = false; $('#saveMsg').textContent = saveText(); } }
  clearTimeout(autoT);
  if (canPublish !== false) autoT = setTimeout(() => { const a = document.activeElement; if (a && /INPUT|SELECT|TEXTAREA/.test(a.tagName)) { autoT = setTimeout(() => save(), 4000); return; } save(); }, 5000);
}

function bind(){
  app.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filter = b.dataset.f; render(); });
  app.querySelectorAll('article.item').forEach(el => {
    const it = S.items.find(i => i.id === el.dataset.id); if (!it) return;
    el.querySelectorAll('.states button').forEach(b => b.onclick = () => { it.estado = b.dataset.st; touch(); });
    el.querySelectorAll('[data-m]').forEach(r => r.onchange = () => { it.sel = +r.dataset.m; touch(); });
    el.querySelectorAll('[data-k]').forEach(inp => {
      const k = inp.dataset.k;
      const evt = inp.tagName === 'SELECT' ? 'change' : 'input';
      inp.addEventListener(evt, () => {
        if (k === 'cant') it.cant = Math.max(1, parseInt(inp.value, 10) || 1);
        else it[k] = inp.value;
        if (k === 'ubic'){ it.ubicOk = true; touch(); } else touch(false);
      });
      if (evt === 'input') inp.addEventListener('change', () => render());
    });
    el.querySelectorAll('[data-r]').forEach(inp => {
      inp.addEventListener('input', () => { const v = num(inp.value); if (v > 0){ it.roller[inp.dataset.r] = v; it.medida = it.roller.w.toFixed(2) + ' × ' + it.roller.h.toFixed(2) + ' m'; touch(false); } });
      inp.addEventListener('change', () => render());
    });
    const del = el.querySelector('[data-del]');
    if (del) del.onclick = () => { if (del.dataset.armed){ S.items = S.items.filter(i => i !== it); touch(); } else { del.dataset.armed = '1'; del.textContent = 'Toca otra vez para quitar'; setTimeout(() => { if (del.isConnected){ delete del.dataset.armed; del.textContent = 'Quitar de la lista'; } }, 3000); } };
  });
  $('#addForm').onsubmit = e => {
    e.preventDefault();
    const n = $('#aNom').value.trim(); if (!n) return;
    const ub = $('#aUb').value;
    const cat = { 'Sala – comedor': 'Sala y comedor', 'Dormitorio principal': 'Dormitorios', 'Dormitorio 2': 'Dormitorios', 'Cuarto de trabajo': 'Dormitorios', 'Cocina': 'Cocina', 'Lavandería': 'Lavandería', 'Baño 1 (principal)': 'Baños', 'Baño 2 (secundario)': 'Baños', 'Baño 3 (servicio)': 'Baños' }[ub] || 'Otros';
    S.items.push({ id: 'c' + Date.now().toString(36), nombre: n, cat, cant: 1, medida: $('#aMed').value.trim(), ubic: ub, ubicOk: ub !== 'Por definir', estado: 'pendiente', precio: '', tienda: '', nota: '', sel: 0, modelos: [], custom: true });
    touch();
  };
  $('#copy').onclick = () => {
    const lines = ['Compras Dpto. 1508 – pendientes', ''];
    for (const it of S.items) if (it.estado === 'pendiente' || it.estado === 'cotizado'){
      const m = it.modelos && it.modelos[it.sel];
      lines.push(`• ${it.nombre}${it.cant > 1 ? ' ×' + it.cant : ''}${it.medida ? ' (' + it.medida + ')' : ''} – ${it.ubic}${m ? '\n  ' + m.n : ''}${it.precio ? '\n  Cotizado: S/ ' + it.precio + (it.tienda ? ' en ' + it.tienda : '') : ''}`);
    }
    const t = lines.join('\n'), out = $('#out');
    const fallback = () => { out.hidden = false; out.value = t; out.select(); };
    try { navigator.clipboard.writeText(t).then(() => { $('#copy').textContent = 'Lista copiada'; }, fallback); } catch (e) { fallback(); }
  };
  const sb = $('#saveBtn'); if (sb) sb.onclick = () => save();
}

const SKELETON = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>';
function documentFromState(){
  const head = '<title>Compras Dpto. 1508</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n' +
    '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
    '<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">\n';
  const css = document.getElementById('estilos').textContent;
  const js = document.getElementById('principal').textContent;
  const data = JSON.stringify(S).replace(/</g, '\\u003c');
  return SKELETON + head + '<style id="estilos">' + css + '</style>\n\n<div class="wrap" id="app"><p class="note">Cargando la lista…</p></div>\n\n<script id="estado" type="application/json">' + data + '<\/script>\n\n<script id="principal">' + js + '<\/script>\n</body></html>';
}
async function save(){
  clearTimeout(autoT);
  if (!dirty || saving) return;
  if (!artifact || canPublish === false){ dirty = false; render(); return; }
  saving = true; render();
  try { sessionStorage.setItem(LS + '-pend', '1'); } catch (e) {}
  try {
    await artifact.publish(documentFromState());
    try { localStorage.removeItem(LS); } catch (e) {}
    dirty = false;
  } catch (err){
    const code = err && err.code;
    if (code === 'conflict'){ /* la vista se recarga con la versión más reciente */ }
    else if (['not_writer', 'not_granted', 'not_declared', 'consent_required', 'capability_disabled', 'capability_removed'].includes(code)){ canPublish = false; }
    else if (code === 'rate_limited'){ autoT = setTimeout(save, 20000); }
    else { autoT = setTimeout(save, 8000 + Math.random() * 4000); }
  }
  saving = false; render();
}

// Si esta vista no puede guardar, recupera lo que se guardó localmente.
function restoreLocal(){ try { const l = JSON.parse(localStorage.getItem(LS) || 'null'); if (l && Array.isArray(l.items)){ S = l; dirty = true; } } catch (e) {} }

render();
(async () => {
  try { artifact = window.claude && window.claude.use ? await window.claude.use('artifact') : null; } catch (e) { artifact = null; }
  if (!artifact){ canPublish = false; restoreLocal(); render(); return; }
  canPublish = true;
})();
})();
</script>
